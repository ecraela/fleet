global
    log stdout format raw local0
    maxconn 512
    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners

defaults
    mode http
    log global
    option httplog
    timeout connect 1s
    timeout client 15s
    timeout server 15s

resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 1s
    timeout resolve 1s
    timeout retry 1s

frontend public
    mode tcp
    option tcplog
    bind :8080
    bind :8443
    default_backend haproxy_nodes

backend haproxy_nodes
    mode tcp
    balance roundrobin
    option httpchk GET /healthz
    option redispatch
    retries 2
    server haproxy-a haproxy-a check port 8404 inter 1s fall 2 rise 2 resolvers docker resolve-prefer ipv4 init-addr libc,none
    server haproxy-b haproxy-b check port 8404 inter 1s fall 2 rise 2 resolvers docker resolve-prefer ipv4 init-addr libc,none

frontend statistics
    bind :8404
    monitor-uri /healthz
    http-request use-service prometheus-exporter if { path /metrics }
