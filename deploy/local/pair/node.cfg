global
    log stdout format raw local0
    log /run/haproxy/access.sock len 2048 format raw local0
    maxconn 512
    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners

defaults
    mode http
    log global
    option httplog
    timeout connect 1s
    timeout client 15s
    timeout server 15s

resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 1s
    timeout resolve 1s
    timeout retry 1s

frontend public
    bind :8080
    no log
    log /run/haproxy/access.sock len 2048 format raw local0
    http-request set-var(txn.cv_path) path
    log-format "cv2 %b %[var(txn.cv_spec)] %s %HM %ST %B %Ta %Tr %Tc %Tw %[ssl_fc] %ts %[var(txn.cv_path),length] %[var(txn.cv_path),hex]"
    http-response set-header X-HAProxy-Node %[env(DEMO_NODE)]
    default_backend application

backend application
    balance roundrobin
    option httpchk GET /healthz
    server app-a pair-backend:8080 weight 100 check inter 1s fall 2 rise 2 resolvers docker resolve-prefer ipv4 init-addr libc,none
    server app-b pair-backend-2:8080 weight 100 check inter 1s fall 2 rise 2 resolvers docker resolve-prefer ipv4 init-addr libc,none

frontend statistics
    bind :8404
    monitor-uri /healthz
    http-request use-service prometheus-exporter if { path /metrics }
