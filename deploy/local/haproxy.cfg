global
    log stdout format raw local0
    maxconn 256

defaults
    mode http
    log global
    option httplog
    timeout connect 3s
    timeout client 15s
    timeout server 15s

frontend demo
    bind :8080
    default_backend application

backend application
    balance roundrobin
    option httpchk GET /
    server app demo-backend:8080 check

frontend statistics
    bind :8404
    http-request use-service prometheus-exporter if { path /metrics }
