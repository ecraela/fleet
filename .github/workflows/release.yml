name: Signed HAProxy release
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'ecraela/fleet'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
      id-token: write
    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_DB: haproxy_manager_test
          POSTGRES_USER: haproxy_manager
          POSTGRES_PASSWORD: isolated-release-test-database
        ports: ["55433:5432"]
        options: --health-cmd "pg_isready -h 127.0.0.1 -U haproxy_manager -d haproxy_manager_test" --health-interval 2s --health-timeout 3s --health-retries 30
      metrics:
        image: victoriametrics/victoria-metrics:v1.154.1
        ports: ["58428:8428"]
    env:
      HAPROXY_TEST_DATABASE_URL: postgres://haproxy_manager:isolated-release-test-database@localhost:55433/haproxy_manager_test?sslmode=disable
      HAPROXY_TEST_METRICS_URL: http://localhost:58428
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.19.0
      - name: Install pinned frontend toolchain
        run: |
          npm install --global pnpm@11.25.0
          make web-install
      - name: Audit frontend dependencies
        run: make web-audit
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.10
      - name: Install pinned backup test tools
        run: go install filippo.io/age/cmd/age@v1.2.1 filippo.io/age/cmd/age-keygen@v1.2.1
      - name: Verify before publishing
        run: make check test vuln
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - name: Check signing tool before building images
        run: cosign version
      - name: Require the public Fleet repository and package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test "$(gh api repos/ecraela/fleet --jq .private)" = false
          test "$(gh api orgs/ecraela/packages/container/fleet --jq .visibility)" = public
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build immutable multi-platform image
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/ecraela/fleet:${{ github.ref_name }}
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/ecraela/fleet
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Build files and sign exact manifest and image
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          RELEASE_REVISION: ${{ github.sha }}
          RELEASE_IMAGE: ghcr.io/ecraela/fleet@${{ steps.image.outputs.digest }}
        run: |
          python3 scripts/release.py --output .build.local/release --version "$RELEASE_VERSION" --revision "$RELEASE_REVISION" --image "$RELEASE_IMAGE"
          python3 scripts/verify_release_images.py .build.local/release
          cosign sign --yes "$RELEASE_IMAGE"
          cosign sign-blob --yes --bundle .build.local/release/release.sigstore.json .build.local/release/release.json
          python3 -I scripts/agentctl.py verify --release .build.local/release --version "$RELEASE_VERSION"
      - name: Verify public package access before creating the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: test "$(gh api orgs/ecraela/packages/container/fleet --jq .visibility)" = public
      - name: Publish Fleet prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: gh release create "$RELEASE_VERSION" .build.local/release/* --verify-tag --prerelease --generate-notes --title "Ecraela Fleet $RELEASE_VERSION"
