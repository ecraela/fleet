name: Published Fleet release qualification

on:
  workflow_dispatch:
    inputs:
      baseline:
        description: Exact published baseline tag with the standalone installer
        required: true
        type: string
      candidate:
        description: Exact newer published candidate tag
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: published-release-${{ inputs.candidate }}
  cancel-in-progress: false

jobs:
  install:
    name: Published assets on clean Ubuntu 24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.10
      - name: Install pinned backup tools
        run: go install filippo.io/age/cmd/age@v1.2.1 filippo.io/age/cmd/age-keygen@v1.2.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Confirm public distribution and download exact release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASELINE_VERSION: ${{ inputs.baseline }}
          CANDIDATE_VERSION: ${{ inputs.candidate }}
        run: |
          python3 - <<'PY'
          import os, re
          for key in ('BASELINE_VERSION', 'CANDIDATE_VERSION'):
              assert re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+(?:-[a-z0-9.-]+)?', os.environ[key])
          PY
          test "$(gh api repos/ecraela/fleet --jq .private)" = false
          test "$(gh api orgs/ecraela/packages/container/fleet --jq .visibility)" = public
          umask 077
          mkdir -p "$RUNNER_TEMP/published-baseline" "$RUNNER_TEMP/published-candidate"
          gh release download "$BASELINE_VERSION" --repo ecraela/fleet --dir "$RUNNER_TEMP/published-baseline"
          gh release download "$CANDIDATE_VERSION" --repo ecraela/fleet --dir "$RUNNER_TEMP/published-candidate"
      - name: Signed install, live two-node traffic, upgrade, rollback and encrypted cold restore
        env:
          BASELINE_VERSION: ${{ inputs.baseline }}
          CANDIDATE_VERSION: ${{ inputs.candidate }}
        run: |
          python3 scripts/selfhost_smoke.py --work "$RUNNER_TEMP/published-install" \
            --baseline-release "$RUNNER_TEMP/published-baseline" --baseline-version "$BASELINE_VERSION" \
            --candidate-release "$RUNNER_TEMP/published-candidate" --candidate-version "$CANDIDATE_VERSION"
      - name: Retain sanitized release qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: published-release-qualification
          path: ${{ runner.temp }}/published-install/latest.json
          if-no-files-found: ignore
          retention-days: 7
