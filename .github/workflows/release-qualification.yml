name: Published Fleet release qualification

on:
  workflow_dispatch:
    inputs:
      baseline:
        description: Exact published baseline tag with the standalone installer
        required: true
        type: string
      candidate:
        description: Exact newer published candidate tag
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: published-release-${{ inputs.candidate }}
  cancel-in-progress: false

jobs:
  install:
    name: Published assets on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.11
      - name: Install pinned backup tools
        run: go install filippo.io/age/cmd/age@v1.2.1 filippo.io/age/cmd/age-keygen@v1.2.1
      - name: Install checksum-pinned Cosign
        run: bash scripts/install_cosign.sh
      - name: Confirm public distribution and download exact release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASELINE_VERSION: ${{ inputs.baseline }}
          CANDIDATE_VERSION: ${{ inputs.candidate }}
        run: |
          python3 - <<'PY'
          import os, re
          for key in ('BASELINE_VERSION', 'CANDIDATE_VERSION'):
              assert re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+(?:-[a-z0-9.-]+)?', os.environ[key])
          PY
          test "$(gh api repos/ecraela/fleet --jq .private)" = false
          test "$(gh api orgs/ecraela/packages/container/fleet --jq .visibility)" = public
          umask 077
          mkdir -p "$RUNNER_TEMP/published-baseline" "$RUNNER_TEMP/published-candidate"
          for kind in baseline candidate; do
            if [ "$kind" = baseline ]; then version="$BASELINE_VERSION"; else version="$CANDIDATE_VERSION"; fi
            for asset in release.json release.sigstore.json agentctl.py selfhostctl.py selfhost.json \
              haproxy-agent-linux-amd64 haproxy-agent-linux-arm64 \
              haproxy-manager-linux-amd64 haproxy-manager-linux-arm64 \
              LICENSE THIRD_PARTY_NOTICES.txt dependencies.json source.tar.gz source.json; do
              curl --fail --location --proto '=https' --tlsv1.2 --connect-timeout 10 --max-time 120 \
                --output "$RUNNER_TEMP/published-$kind/$asset" \
                "https://github.com/ecraela/fleet/releases/download/$version/$asset"
            done
          done
      - name: Use an empty Docker credential configuration
        run: |
          mkdir -m 700 "$RUNNER_TEMP/anonymous-docker"
          printf '{}\n' > "$RUNNER_TEMP/anonymous-docker/config.json"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/anonymous-docker" >> "$GITHUB_ENV"
      - name: Signed install, live two-node traffic, upgrade, rollback and encrypted cold restore
        env:
          BASELINE_VERSION: ${{ inputs.baseline }}
          CANDIDATE_VERSION: ${{ inputs.candidate }}
        run: |
          python3 scripts/selfhost_smoke.py \
            --native-agent --work "$RUNNER_TEMP/published-install" \
            --baseline-release "$RUNNER_TEMP/published-baseline" --baseline-version "$BASELINE_VERSION" \
            --candidate-release "$RUNNER_TEMP/published-candidate" --candidate-version "$CANDIDATE_VERSION"
      - name: Retain sanitized release qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: published-release-qualification-${{ runner.arch }}
          path: ${{ runner.temp }}/published-install/latest.json
          if-no-files-found: ignore
          retention-days: 7
